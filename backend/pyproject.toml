[project]
name = "pinpoint-backend"
version = "0.1.0"
description = "Pinpoint API: trips, days, stops and edits, backed by Postgres."
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.20.1",
    "beautifulsoup4>=4.15.0",
    "fastapi>=0.162.0",
    "ortools>=9.15.6755",
    "psycopg[binary]>=3.3.6",
    "pydantic-settings>=2.16.1",
    "sqlalchemy>=2",
    "uvicorn[standard]>=0.54.0",
]

[build-system]
requires = ["uv_build>=0.13.5,<0.14.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "pinpoint"

[dependency-groups]
dev = [
    "httpx2>=2.16.0",
    "pytest>=9.1.1",
    "ruff>=0.17.2",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
